" y="819.5891"/><line style="stroke:#000000;stroke-width:1.0;" x1="0" x2="909.5" y1="819.5891" y2="819.5891"/><line style="stroke:#000000;stroke-width:1.0;" x1="0" x2="909.5" y1="822.5891" y2="822.5891"/><rect fill="#EEEEEE" height="25.706" style="stroke:#000000;stroke-width:2.0;" width="197" x="356.25" y="807.7361"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="180" x="362.25" y="825.6331">Segunda barreira: as regras</text><polygon fill="#181818" points="584,880.8542,574,884.8542,584,888.8542,580,884.8542" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="578" x2="830" y1="884.8542" y2="884.8542"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="590" y="870.1922">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216" x="608" y="861.3391">Tenta gravar uma reserva e escrever</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204" x="608" y="879.0452">por cima do bloqueio que j&#225; existe</text><polygon fill="#181818" points="819,912.5602,829,916.5602,819,920.5602,823,916.5602" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="573" x2="825" y1="916.5602" y2="916.5602"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="580" y="910.7512">13</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111" x="598" y="910.7512">permission-denied</text><path d="M5,929.5602 L5,974.5602 L445,974.5602 L445,939.5602 L435,929.5602 L5,929.5602 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M435,929.5602 L435,939.5602 L445,939.5602 L435,929.5602 " fill="#FAFAFA" style="stroke:#181818;stroke-wid