71,541.382,561,545.382,565,541.382" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="272" x2="567" y1="541.382" y2="541.382"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="279" y="535.573">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228" x="290" y="535.573">Grava a reserva B e o mesmo bloqueio</text><polygon fill="#181818" points="283,569.088,273,573.088,283,577.088,279,573.088" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="277" x2="572" y1="573.088" y2="573.088"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="289" y="567.279">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266" x="300" y="567.279">Rejeitado: o bloqueio lido mudou entretanto</text><polygon fill="#181818" points="561,618.5,571,622.5,561,626.5,565,622.5" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="272" x2="567" y1="622.5" y2="622.5"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="279" y="607.838">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162" x="290" y="598.985">O SDK repete a transa&#231;&#227;o B</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135" x="290" y="616.691">e volta a ler o bloqueio</text><polygon fill="#181818" points="283,650.206,273,654.206,283,658.206,279,654.206" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="277" x2="572" y1="654.206" y2="654.206"/><text fill="#000000" font-family="sans-serif" font-size="1