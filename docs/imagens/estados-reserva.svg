<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="436px" preserveAspectRatio="none" style="width:731px;height:436px;background:#FFFFFF;" version="1.1" viewBox="0 0 731 436" width="731px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="283" x="217.48" y="24.9659">CampusReserva: estados de uma reserva</text><g id="ativa"><rect fill="#F1F1F1" height="55.412" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="219" x="121.96" y="193.7779"/><line style="stroke:#181818;stroke-width:0.5;" x1="121.96" x2="340.96" y1="222.8458" y2="222.8458"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="32" x="215.46" y="213.7439">ativa</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199" x="126.96" y="240.6739">1 a 6 bloqueios em reservationSlots</text></g><g id="cancelada"><rect fill="#F1F1F1" height="71.7561" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="291" x="85.96" y="358.8879"/><line style="stroke:#181818;stroke-width:0.5;" x1="85.96" x2="376.96" y1="387.9558" y2="387.9558"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68" x="197.46" y="378.8539">cancelada</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="81" x="90.96" y="405.7839">sem bloqueios</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="271" x="90.96" y="422.128">guarda cancelledAt, cancelledBy e cancelReason</text></g><ellipse cx="231.46" cy="56.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN9"><path d="M376.46,181.0679 L376.46,217.4779 L341.33,221.4779 L376.46,225.4779 L376.46,261.892 A0,0 0 0 0 376.46,261.892 L672.46,261.892 A0,0 0 0 0 672.46,261.892 L672.46,191.0679 L662.46,181.0679 L376.46,181.0679 A0,0 0 0 0 376.46,181.0679 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M662.46,181.0679 L662.46,191.0679 L672.46,191.0679 L662.46,181.0679 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273" x="382.46" y="199.9649">Cancelar apaga todos os bloqueios na mesma</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229" x="382.46" y="217.6709">opera&#231;&#227;o, e o hor&#225;rio volta a ficar livre.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275" x="382.46" y="235.377">Uma reserva que j&#225; terminou continua "ativa":</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256" x="382.46" y="253.083">n&#227;o existe um estado de reserva conclu&#237;da.</text></g><g id="elem_GMN12"><path d="M411.96,363.2079 L411.96,390.7679 L377.25,394.7679 L411.96,398.7679 L411.96,426.326 A0,0 0 0 0 411.96,426.326 L724.96,426.326 A0,0 0 0 0 724.96,426.326 L724.96,373.2079 L714.96,363.2079 L411.96,363.2079 A0,0 0 0 0 411.96,363.2079 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M714.96,363.2079 L714.96,373.2079 L724.96,373.2079 L714.96,363.2079 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292" x="417.96" y="382.1049">Estado final: as regras n&#227;o deixam voltar a "ativa"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249" x="417.96" y="399.8109">nem alterar a reserva, e ningu&#233;m a apaga.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280" x="417.96" y="417.517">cancelledBy &#233; sempre o UID de quem cancelou.</text></g><!--link *start* to ativa--><g id="link_*start*_ativa"><path d="M231.46,66.3179 C231.46,90.4279 231.46,149.8679 231.46,187.2779 " fill="none" id="*start*-to-ativa" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="231.46,193.2779,235.46,184.2779,231.46,188.2779,227.46,184.2779,231.46,193.2779" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194" x="232.46" y="110.9649">quem tem sess&#227;o reserva para si</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166" x="246.46" y="128.6709">(userId &#233; o seu UID), com os</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186" x="236.46" y="146.377">bloqueios na mesma transa&#231;&#227;o</text></g><!--link ativa to cancelada--><g id="link_ativa_cancelada"><path d="M121.53,243.0279 C61.89,259.3779 6,286.6579 36.46,328.8879 C48.98,346.2579 60.9496,356.4029 80.1996,365.8129 " fill="none" id="ativa-to-cancelada" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="85.59,368.4479,79.261,360.9018,81.098,366.2521,75.7477,368.089,85.59,368.4479" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90" x="67.46" y="306.7849">o dono cancela</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150" x="37.46" y="324.4909">cancelReason "utilizador"</text></g><!--link ativa to cancelada--><g id="link_ativa_cancelada"><path d="M230.02,249.4979 C229.4,262.3379 228.76,277.9079 228.46,291.8879 C228.1,308.3279 228.08,312.4479 228.46,328.8879 C228.68,338.4779 228.7985,342.8545 229.2485,352.4345 " fill="none" id="ativa-to-cancelada-1" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="229.53,358.4279,233.1033,349.2501,229.2954,353.4334,225.1121,349.6255,229.53,358.4279" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109" x="241.46" y="306.7849">um gestor cancela</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133" x="229.46" y="324.4909">cancelReason "gestor"</text></g><!--link ativa to cancelada--><g id="link_ativa_cancelada"><path d="M311.13,249.6379 C351.75,268.1779 388.57,295.4279 367.46,328.8879 C359.99,340.7279 354.6433,347.0473 343.0433,355.0273 " fill="none" id="ativa-to-cancelada-2" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="338.1,358.4279,347.782,356.6225,342.2194,355.5941,343.2478,350.0315,338.1,358.4279" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174" x="393.1" y="306.7849">um gestor desativa o recurso</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211" x="374.6" y="324.4909">cancelReason "recurso_desativado"</text></g><!--SRC=[XLDDJnj13Btlhx1o0QeGr0k772hnqKhSAYfEfQgSNISxT6Qy7S-aq7-3UgWuy2lsZzMp7ycM2bL22Zksdv_zdW_W0flsEIRBSBg4Qn8AMnGGSY2y2jImcFPt-uiNnG5yO1z9bj2abJNboPsSL2ZrYZ5KYpk1mvBzsWGte4J3_ZpwEPJeIx8VoLV6RoR1kKBkIpY5aYu9osZwy14GQ8maSg15I9QqXSDOrd0IzYYYQLkqfhhesjY-Tb4KqKHBEfzhaWnTbw1eMB50HP0Sme1J5FBD-0O3Ed3ikQm3Eu8O4aqYKclf3vq1rcY5Yjee2hacFYYSbC4qkRLYHOm4Cyo3p42tsVqtFlVRmAeFxRwAeik29Rm5X5DOMVwUo2XLbM8oxYVBKOfTcUPdhNRPVqKsIPN1eOUbwYpEzn_d3xgu_kkQK3Bnps- -mF7nEnYPAAI3cAr08kg1aGVaVO2OMt-OzE6gWlO9MBCIt5nT7caJTi1ow_T3U0H7eXkF0RrWPwbXujnnofgXKWd6fri_vGYp58qrFrM8C7kbFZdOTAPv3QAF_hzSHUrJyk1b2i8laORdhsDcnREYyAmo1xEf8_1wq1wWToS6m0OtkWREBjI_VrUaoTnGw7SqLv4OQWxjOp0CMxOHrHzhKogKDLkz3Cs_sLivYmPtxQFg5fpndFA9HUCJZevSQe7FQjAzaPZlOBYAV1GZYXQLDhNF5IuAFLp8GxqSRUzTWFSzmjfujCjix42Re3zTeuhClTvFHruNC1B9FDHSQ9Lgz