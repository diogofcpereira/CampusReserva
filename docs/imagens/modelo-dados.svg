<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1048px" preserveAspectRatio="none" style="width:1004px;height:1048px;background:#FFFFFF;" version="1.1" viewBox="0 0 1004 1048" width="1004px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="358" x="316.25" y="24.9659">CampusReserva: modelo de dados (Cloud Firestore)</text><!--class User--><g id="elem_User"><rect codeLine="10" fill="#F1F1F1" height="194.8874" id="User" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="347" x="650.5" y="66.1379"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="52" x="798" y="83.966">&#171;cole&#231;&#227;o&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37" x="805.5" y="102.448">users</text><line style="stroke:#181818;stroke-width:0.5;" x1="651.5" x2="996.5" y1="111.5499" y2="111.5499"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="335" x="656.5" y="130.5159">ID do documento: UID da conta na Authentication</text><line style="stroke:#181818;stroke-width:1.0;" x1="651.5" x2="996.5" y1="138.6179" y2="138.6179"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74" x="656.5" y="157.5838">uid : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89" x="656.5" y="176.6517">email : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="140" x="656.5" y="195.7196">displayName : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78" x="656.5" y="214.7876">role : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="656.5" y="233.8555">createdAt : timestamp</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155" x="656.5" y="252.9234">updatedAt : timestamp</text></g><!--class Resource--><g id="elem_Resource"><rect codeLine="21" fill="#F1F1F1" height="233.0233" id="Resource" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="280" x="7" y="47.0679"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="52" x="121" y="64.896">&#171;cole&#231;&#227;o&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66" x="114" y="83.378">resources</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="286" y1="92.4799" y2="92.4799"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="268" x="13" y="111.4459">ID do documento: gerado pelo Firestore</text><line style="stroke:#181818;stroke-width:1.0;" x1="8" x2="286" y1="119.5479" y2="119.5479"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90" x="13" y="138.5138">name : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="81" x="13" y="157.5817">type : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105" x="13" y="176.6496">location : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="85" x="13" y="195.7176">capacity : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128" x="13" y="214.7855">description : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105" x="13" y="233.8534">active : boolean</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="13" y="252.9213">createdAt : timestamp</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155" x="13" y="271.9892">updatedAt : timestamp</text></g><!--class Reservation--><g id="elem_Reservation"><rect codeLine="34" fill="#F1F1F1" height="427.7025" id="Reservation" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="388" x="437" y="359.0979"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="52" x="605" y="376.926">&#171;cole&#231;&#227;o&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83" x="589.5" y="395.408">reservations</text><line style="stroke:#181818;stroke-width:0.5;" x1="438" x2="824" y1="404.5099" y2="404.5099"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="268" x="443" y="423.4759">ID do documento: gerado pelo Firestore</text><line style="stroke:#181818;stroke-width:1.0;" x1="438" x2="824" y1="431.5779" y2="431.5779"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96" x="443" y="450.5438">userId : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125" x="443" y="469.6117">resourceId : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="334" x="443" y="488.6796">resourceName : string, c&#243;pia do nome do recurso</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="269" x="443" y="507.7476">resourceType : "sala" ou "equipamento"</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="376" x="443" y="526.8155">date : string AAAA-MM-DD, hoje ou futura (UTC) ao criar</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="287" x="443" y="545.8834">startTime : string HH:MM, de 08:00 a 21:30</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="234" x="443" y="564.9513">endTime : string HH:MM, at&#233; 22:00</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="302" x="443" y="584.0192">durationMinutes : 30, 60, 90, 120, 150 ou 180</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="276" x="443" y="603.0871">unitNumber : inteiro, sempre 1 nas salas</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="284" x="443" y="622.1551">slotId : string, igual ao primeiro de slotIds</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="259" x="443" y="641.223">slotIds : lista de 1 a 6 IDs de bloqueios</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202" x="443" y="660.2909">status : "ativa" ou "cancelada"</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="443" y="679.3588">createdAt : timestamp</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162" x="443" y="721.4946">cancelledAt : timestamp</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132" x="443" y="740.5626">cancelledBy : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144" x="443" y="759.6305">cancelReason : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163" x="443" y="778.6984">ou "recurso_desativado"</text><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:1.0,2.0;" x1="438" x2="552.5" y1="696.9947" y2="696.9947"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157" x="552.5" y="701.9267">s&#243; depois de cancelada</text><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:1.0,2.0;" x1="709.5" x2="824" y1="696.9947" y2="696.9947"/></g><!--class Slot--><g id="elem_Slot"><rect codeLine="57" fill="#F1F1F1" height="175.8195" id="Slot" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="233" x="210.5" y="865.7979"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="52" x="301" y="883.626">&#171;cole&#231;&#227;o&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="108" x="273" y="902.108">reservationSlots</text><line style="stroke:#181818;stroke-width:0.5;" x1="211.5" x2="442.5" y1="911.2099" y2="911.2099"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221" x="216.5" y="930.1759">ID do documento: determin&#237;stico</text><line style="stroke:#181818;stroke-width:1.0;" x1="211.5" x2="442.5" y1="938.2779" y2="938.2779"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142" x="216.5" y="957.2438">reservationId : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125" x="216.5" y="976.3117">resourceId : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82" x="216.5" y="995.3796">date : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116" x="216.5" y="1014.4476">startTime : string</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139" x="216.5" y="1033.5155">unitNumber : inteiro</text></g><g id="elem_GMN11"><path d="M322,105.4679 L322,159.5879 L287.25,163.5879 L322,167.5879 L322,221.704 A0,0 0 0 0 322,221.704 L616,221.704 A0,0 0 0 0 616,221.704 L616,115.4679 L606,105.4679 L322,105.4679 A0,0 0 0 0 322,105.4679 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M606,105.4679 L606,115.4679 L616,115.4679 L606,105.4679 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180" x="328" y="124.3649">capacity tem dois significados:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271" x="328" y="142.0709">numa sala, o n&#250;mero de lugares, e &#233; opcional;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256" x="328" y="159.777">num equipamento, o n&#250;mero de unidades,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206" x="328" y="177.483">cada uma reserv&#225;vel em separado.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273" x="328" y="195.189">Desativar um recurso cancela as suas reservas</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70" x="328" y="212.895">por realizar.</text></g><!--link User to Reservation--><g id="link_User_Reservation"><path codeLine="67" d="M750.75,261.2879 C740.35,277.1479 730.36,293.7579 722,310.0979 C714.05,325.6279 706.53,342.0079 699.48,358.6879 " fill="none" id="User-Reservation" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="38" x="723" y="324.9949">userId</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7" x="738.1137" y="283.0104">1</text><text fill="#000000" font-family="sans-serif" fon