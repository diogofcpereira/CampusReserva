<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1338px" preserveAspectRatio="none" style="width:494px;height:1338px;background:#FFFFFF;" version="1.1" viewBox="0 0 494 1338" width="494px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="365" x="57.545" y="24.9659">CampusReserva: casos de uso por perfil de utilizador</text><!--cluster CampusReserva--><g id="cluster_CampusReserva"><rect fill="none" height="1131" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="345.18" x="142.91" y="47.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="110" x="260.5" y="64.0339">CampusReserva</text></g><g id="elem_UC1"><ellipse cx="315.501" cy="187.0698" fill="#F1F1F1" rx="66.151" ry="17.0018" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74" x="275.501" y="191.8027">Criar conta</text></g><g id="elem_UC2"><ellipse cx="315.4973" cy="257.0674" fill="#F1F1F1" rx="76.0473" ry="17.6095" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="92" x="266.4973" y="261.8003">Iniciar sess&#227;o</text></g><g id="elem_UC12"><ellipse cx="315.4985" cy="110.0636" fill="#F1F1F1" rx="110.6285" ry="24.5257" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180" x="222.4985" y="114.7966">Recuperar a palavra-passe</text></g><g id="elem_UC3"><ellipse cx="315.5042" cy="524.0634" fill="#F1F1F1" rx="134.1242" ry="30.4754" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="170" x="227.5042" y="519.2624">Consultar recursos ativos</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157" x="234.0042" y="538.3303">e a sua disponibilidade</text></g><g id="elem_UC4"><ellipse cx="315.5044" cy="617.0728" fill="#F1F1F1" rx="124.7744" ry="27.3549" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212" x="208.1149" y="621.1577">Reservar sala ou equipamentos</text></g><g id="elem_UC5"><ellipse cx="315.495" cy="336.0709" fill="#F1F1F1" rx="122.065" ry="26.813" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="206" x="210.5702" y="340.3831">Consultar as pr&#243;prias reservas</text></g><g id="elem_UC6"><ellipse cx="315.5038" cy="428.0667" fill="#F1F1F1" rx="139.7438" ry="30.3488" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174" x="224.2538" y="423.2657">Cancelar as suas reservas</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179" x="221.7538" y="442.3336">que ainda n&#227;o come&#231;aram</text></g><g id="elem_UC7"><ellipse cx="315.499" cy="942.0637" fill="#F1F1F1" rx="98.379" ry="22.0758" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151" x="236.999" y="946.7967">Criar e editar recursos</text></g><g id="elem_UC8"><ellipse cx="315.4968" cy="704.0673" fill="#F1F1F1" rx="110.1968" ry="24.4394" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179" x="222.9968" y="708.8002">Ativar e desativar recursos</text></g><g id="elem_UC11"><ellipse cx="315.5045" cy="851.0668" fill="#F1F1F1" rx="155.4945" ry="33.4989" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221" x="202.0045" y="846.2658">Cancelar as reservas por realizar</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="238.0045" y="865.3337">do recurso desativado</text></g><g id="elem_UC9"><ellipse cx="315.4952" cy="1033.065" fill="#F1F1F1" rx="156.5852" ry="33.717" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="280" x="175.4952" y="1036.4969">Consultar e cancelar as reservas de todos</text></g><g id="elem_UC10"><ellipse cx="315.5027" cy="1132.071" fill="#F1F1F1" rx="133.3927" ry="30.4731" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169" x="228.0027" y="1127.27">Promover e despromover</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126" x="249.5027" y="1146.338">outros utilizadores</text></g><!--entity V--><g id="elem_V"><ellipse cx="44.5" cy="146.4979" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M44.5,154.4979 L44.5,181.4979 M31.5,162.4979 L57.5,162.4979 M44.5,181.4979 L31.5,196.4979 M44.5,181.4979 L57.5,196.4979 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58" x="6" y="212.9639">Visitante</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77" x="6" y="232.0318">sem sess&#227;o</text></g><!--entity U--><g id="elem_U"><ellipse cx="44.5" cy="445.0279" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M44.5,453.0279 L44.5,480.0279 M31.5,461.0279 L57.5,461.0279 M44.5,480.0279 L31.5,495.0279 M44.5,480.0279 L57.5,495.0279 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65" x="12" y="511.4939">Utilizador</text></g><!--entity G--><g id="elem_G"><ellipse cx="44.5" cy="911.0279" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M44.5,919.0279 L44.5,946.0279 M31.5,927.0279 L57.5,927.0279 M44.5,946.0279 L31.5,961.0279 M44.5,946.0279 L57.5,961.0279 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44" x="22.5" y="977.4939">Gestor</text></g><g id="elem_GMN32"><path d="M144,1197.0979 L144,1331.04 L487,1331.04 L487,1207.0979 L477,1197.0979 L144,1197.0979 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M477,1197.0979 L477,1207.0979 L487,1207.0979 L477,1197.0979 " fill="#FAFAFA" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278" x="150" y="1215.9949">O gestor tamb&#233;m reserva, mas n&#227;o tem a vista</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310" x="150" y="1233.7009">"As minhas reservas": v&#234; as suas em "Gerir reservas",</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322" x="150" y="1251.407">junto com as de todos, e pode cancelar qualquer uma.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295" x="150" y="1269.113">Uma conta nova &#233; sempre criada como utilizador.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291" x="150" y="1286.819">O primeiro gestor &#233; definido na consola Firebase;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254" x="150" y="1304.525">os seguintes s&#227;o promovidos na aplica&#231;&#227;o.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215" x="150" y="1322.231">Ningu&#233;m altera o seu pr&#243;prio papel.</text></g><!--link V to UC1--><g id="link_V_UC1"><path d="M83.47,187.0679 C126.41,187.0679 191.1,187.0679 242.99,187.0679 " fill="none" id="V-to-UC1" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="248.99,187.0679,239.99,183.0679,243.99,187.0679,239.99,191.0679,248.99,187.0679" style="stroke:#181818;stroke-width:1.0;"/></g><!--link V to UC2--><g id="link_V_UC2"><path d="M83.27,203.5979 C99.01,210.0279 117.63,217.0479 134.91,222.0679 C172.74,233.0579 210.1356,240.5983 244.7556,246.5083 " fill="none" id="V-to-UC2" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="250.67,247.5179,242.4714,242.0605,245.7413,246.6765,241.1252,249.9464,250.67,247.5179" style="stroke:#181818;stroke-width:1.0;"/></g><!--link V to UC12--><g id="link_V_UC12"><path d="M83.36,170.8579 C99.12,164.4779 117.72,157.4079 134.91,152.0679 C166.41,142.2779 195.7755,134.8812 226.6255,127.9612 " fill="none" id="V-to-UC12" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="232.48,126.6479,222.8227,124.7148,227.6012,127.7423,224.5737,132.5208,232.48,126.6479" style="stroke:#181818;stroke-width:1.0;"/></g><!--link U to UC3--><g id="link_U_UC3"><path d="M77.41,481.7579 C109.84,487.5479 155.9434,495.7736 203.0034,504.1736 " fill="none" id="U-to-UC3" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="208.91,505.2279,200.7529,499.7087,203.9878,504.3493,199.3472,507.5842,208.91,505.2279" style="stroke:#181818;stroke-width:1.0;"/></g><!--link U to UC4--><g id="link_U_UC4"><path d="M73.68,515.8279 C89.56,535.4779 110.99,557.9379 134.91,572.0679 C158.03,585.7079 179.356,593.7554 205.436,600.4054 " fill="none" id="U-to-UC4" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818"