<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1254px" preserveAspectRatio="none" style="width:494px;height:1254px;background:#FFFFFF;" version="1.1" viewBox="0 0 494 1254" width="494px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="365" x="57.545" y="24.9659">CampusReserva: casos de uso por perfil de utilizador</text><!--cluster CampusReserva--><g id="cluster_CampusReserva"><rect fill="none" height="1047" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="345.18" x="142.91" y="47.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="110" x="260.5" y="64.0339">CampusReserva</text></g><g id="elem_UC1"><ellipse cx="315.501" cy="173.0698" fill="#F1F1F1" rx="66.151" ry="17.0018" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74" x="275.501" y="177.8027">Criar conta</text></g><g id="elem_UC2"><ellipse cx="315.4973" cy="103.0674" fill="#F1F1F1" rx="76.0473" ry="17.6095" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="92" x="266.4973" y="107.8003">Iniciar sess&#227;o</text></g><g id="elem_UC3"><ellipse cx="315.5042" cy="530.0634" fill="#F1F1F1" rx="134.1242" ry="30.4754" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="170" x="227.5042" y="525.2624">Consultar recursos ativos</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157" x="234.0042" y="544.3303">e a sua disponibilidade</text></g><g id="elem_UC4"><ellipse cx="315.5044" cy="437.0728" fill="#F1F1F1" rx="124.7744" ry="27.3549" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212" x="208.1149" y="441.1577">Reservar sala ou equipamentos</text></g><g id="elem_UC5"><ellipse cx="315.495" cy="252.0709" fill="#F1F1F1" rx="122.065" ry="26.813" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="206" x="210.5702" y="256.3831">Consultar as pr&#243;prias reservas</text></g><g id="elem_UC6"><ellipse cx="315.5038" cy="344.0667" fill="#F1F1F1" rx="139.7438" ry="30.3488" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174" x="224.2538" y="339.2657">Cancelar as suas reservas</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179" x="221.7538" y="358.3336">que ainda n&#227;o come&#231;aram</text></g><g id="elem_UC7"><ellipse cx="315.499" cy="858.0637" fill="#F1F1F1" rx="98.379" ry="22.0758" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151" x="236.999" y="862.7967">Criar e editar recursos</text></g><g id="elem_UC8"><ellipse cx="315.4968" cy="620.0673" fill="#F1F1F1" rx="110.1968" ry="24.4394" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179" x="222.9968" y="624.8002">Ativar e desativar recursos</text></g><g id="elem_UC11"><ellipse cx="315.5045" cy="767.0668" fill="#F1F1F1" rx="155.4945" ry="33.4989" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221" x="202.0045" y="762.2658">Cancelar as reservas por realizar</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="238.0045" y="781.3337">do recurso desativado</text></g><g id="elem_UC9"><ellipse cx="315.4952" cy="949.065" fill="#F1F1F1" rx="156.5852" ry="33.717" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="280" x="175.4952" y="952.4969">Consultar e cancelar as reservas de todos</text></g><g id="elem_UC10"><ellipse cx="315.5027" cy="1048.071" fill="#F1F1F1" rx="133.3927" ry="30.4731" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169" x="228.0027" y="1043.27">Promover e despromover</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126" x="249.5027" y="1062.338">outros utilizadores</text></g><!--entity V--><g id="elem_V"><ellipse cx="44.5" cy="98.4979" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M44.5,106.4979 L44.5,133.4979 M31.5,114.4979 L57.5,114.4979 M44.5,133.4979 L31.5,148.4979 M44.5,133.4979 L57.5,148.4979 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58" x="6" y="164.9639">Visitante</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77" x="6" y="184.0318">sem sess&#227;o</text></g><!--entity U--><g id="elem_U"><ellipse cx="44.5" cy="360.0279" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M44.5,368.0279 L44.5,395.0279 M31.5,376.0279 L57.5,376.0279 M44.5,395.0279 L31.5,410.0279 M44.5,395.0279 L57.5,410.0279 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65" x="12" y="426.4939">Utilizador</text></g><!--entity G--><g id="elem_G"><ellipse cx="44.5" cy="827.0279" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M44.5,835.0279 L44.5,862.0279 M31.5,843.0279 L57.5,843.0279 M44.5,862.0279 L31.5,877.0279 M44.5,862.0279 L57.5,877.0279 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44" x="22.5" y="893.4939">Gestor</text></g><g id="elem_GMN30"><path d="M144,1113.0979 L144,1247.04 L487,1247.04 L487,1123.0979 L477,1113.0979 L144,1113.0979 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M477,1113.0979 L477,1123.0979 L487,1123.0979 L477,1113.0979 " fill="#FAFAFA" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278" x="150" y="1131.9949">O gestor tamb&#233;m reserva, mas n&#227;o tem a vista</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310" x="150" y="1149.7009">"As minhas reservas": v&#234; as suas em "Gerir reservas",</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322" x="150" y="1167.407">junto com as de todos, e pode cancelar qualquer uma.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295" x="150" y="1185.113">Uma conta nova &#233; sempre criada como utilizador.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291" x="150" y="1202.819">O primeiro gestor &#233; definido na consola Firebase;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254" x="150" y="1220.525">os seguintes s&#227;o promovidos na aplica&#231;&#227;o.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215" x="150" y="1238.231">Ningu&#233;m altera o seu pr&#243;prio papel.</text></g><!--link V to UC1--><g id="link_V_UC1"><path d="M83.47,143.8679 C128.22,149.5179 197.1474,158.2352 249.4974,164.8552 " fill="none" id="V-to-UC1" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="255.45,165.6079,247.0229,160.5104,250.4895,164.9806,246.0193,168.4472,255.45,165.6079" style="stroke:#181818;stroke-width:1.0;"/></g><!--link V to UC2--><g id="link_V_UC2"><path d="M83.47,133.9879 C126.34,128.2479 190.913,119.6036 242.783,112.6636 " fill="none" id="V-to-UC2" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="248.73,111.8679,239.279,109.0968,243.7742,112.531,240.3399,117.0261,248.73,111.8679" style="stroke:#181818;stroke-width:1.0;"/></g><!--link U to UC3--><g id="link_U_UC3"><path d="M76.15,430.8779 C91.92,448.8879 112.53,469.0179 134.91,482.0679 C157.22,495.0679 177.3415,503.0128 202.4215,510.0228 " fill="none" id="U-to-UC3" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="208.2,511.6379,200.609,505.3629,203.3846,510.292,198.4555,513.0676,208.2,511.6379" style="stroke:#181818;stroke-width:1.0;"/></g><!--link U to UC4--><g id="link_U_UC4"><path d="M77.41,396.5279 C111.44,402.3479 161.1259,410.836 209.9259,419.186 " fill="none" id="U-to-UC4" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="215.84,420.1979,207.6435,414.7373,210.9116,419.3546,206.2943,422.6227,215.84,420.1979" style="stroke:#181818;stroke-width:1.0;"/></g><!--link U to UC5--><g id="link_U_UC5"><path d="M74.12,351.1879 C89.97,331.8479 111.24,309.8779 134.91,296.0679 C158.21,282.4779 179.7267,274.5232 205.9567,268.0132 " fill="none" id="U-to-UC5" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="211.78,266.5679,202.0815,264.8536,206.9272,267.7723,204.0085,272.6181,211.78,266.5679" style="stroke:#181818;stroke-width:1.0;"/></g><!--link U to UC6--><g id="link_U_UC6"><path d="M77.41,385.4879 C109.08,379.9579 153.4996,372.2012 199.6596,364.1312 " fill="none" id="U-to-UC6" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" 