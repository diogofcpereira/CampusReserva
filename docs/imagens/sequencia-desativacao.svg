 x2="440" y1="252.9599" y2="265.9599"/><line style="stroke:#181818;stroke-width:1.0;" x1="399" x2="440" y1="265.9599" y2="265.9599"/><polygon fill="#181818" points="409,261.9599,399,265.9599,409,269.9599,405,265.9599" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="405" y="247.1509">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230" x="416" y="247.1509">Fica com as que ainda n&#227;o terminaram</text><path d="M10,280.9599 L73,280.9599 L73,290.6659 L63,300.6659 L10,300.6659 L10,280.9599 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="566.3962" style="stroke:#000000;stroke-width:1.5;" width="920" x="10" y="280.9599"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="18" x="25" y="295.8569">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="165" x="88" y="294.7188">[N&#227;o h&#225; reservas por realizar]</text><polygon fill="#181818" points="714,320.3719,724,324.3719,714,328.3719,718,324.3719" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="398" x2="720" y1="324.3719" y2="324.3719"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="405" y="318.5629">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187" x="416" y="318.5629">Atualiza o recurso: active = false</text><polygon fill="#181818" points="844,352.0779,854,356.0779,844,360.0779,848,356.0779" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="726" x2="850" y1="356.0779" y2="356.0779"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="733" y="350.2689">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95" x="744" y="350.2689">Grava (&#233; gestor)</text><polygon fill="#181818" points="56,383.784,46,387.784,56,391.784,52,387.784" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="50" x2="397" y1="387.784" y2="387.784"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="62" y="381.975">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318" x="73" y="381.975">"Recurso desativado. N&#227;o tinha reservas por realizar."</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="930" y1="396.784" y2="396.784"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="140" x="15" y="408.5429">[H&#225; reservas por realizar]</text><polygon fill="#181818" points="56,432.4719,46,436.4719,56,440.4719,52,436.4719" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="50" x2="397" y1="436.4719" y2="436.4719"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="62" y="430.6629">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241" x="73" y="430.6629">Janela com a lista das reservas a cancelar</text><polygon fill="#181818" points="386,464.1779,396,468.1779,386,472.1779,390,468.1779" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="45" x2="392" y1="468.1779" y2="468.1779"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="52" y="462.3689">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194" x="63" y="462.3689">"Desativar e cancelar N reservas"</text><line style="stroke:#181818;stroke-width:1.0;" x1="398" x2="440" y1="499.8839" y2="499.8839"/><line style="stroke:#181818;stroke-width:1.0;" x1="440" x2="440" y1="499.8839" y2="512.8839"/><line style="stroke:#181818;stroke-width:1.0;" x1="399" x2="440" y1="512.8839" y2="512.8839"/><polygon fill="#181818" points="409,508.8839,399,512.8839,409,516.8839,405,512.8839" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="405" y="494.0749">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296" x="423" y="494.0749">Divide as reservas em lotes de at&#233; 16 documentos</text><path d="M353.5,527.8839 L426.5,527.8839 L426.5,537.5899 L416.5,547.5899 L353.5,547.5899 L353.5,527.8839 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="249.0602" style="stroke:#000000;stroke-width:1.5;" width="566.5" x="353.5" y="527.8839"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28" x="368.5" y="542.7809">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="231" x="441.5" y="541.6428">[Para cada lote (uma transa&#231;&#227;o por lote)]</text><polygon fill="#181818" points="844,567.2959,854,571.2959,844,575.2959,848,571.2959" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="398" x2="850" y1="571.2959" y2="571.2959"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="405" y="565.4869">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211" x="423" y="565.4869">L&#234; cada reserva e os seus bloqueios</text><polygon fill="#181818" points="409,599.002,399,603.002,409,607.002,405,603.002" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="403" x2="855" y1="603.002" y2="603.002"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="415" y="597.1929">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="74" x="433" y="597.1929">Estado atual</text><polygon fill="#181818" points="714,701.532,724,705.532,714,709.532,718,705.532" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="398" x2="720" y1="705.532" y2="705.532"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="405" y="664.311">13</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117" x="423" y="628.899">Grava em conjunto:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268" x="423" y="646.605">no primeiro lote, o recurso com active = false;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262" x="423" y="664.311">cada reserva ainda ativa passa a "cancelada"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243" x="423" y="682.017">com cancelReason "recurso_desativado";</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192" x="423" y="699.723">os seus bloqueios s&#227;o apagados</text><polygon fill="#181818" points="844,733.2381,854,737.2381,844,741.2381,848,737.2381" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="726" x2="850" y1="737.2381" y2="737.2381"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="733" y="731.429">14</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72" x="751" y="731.429">Grava o lote</text><polygon fill="#181818" points="409,764.9441,399,768.9441,409,772.9441,405,768.9441" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="403" x2="855" y1="768.9441" y2="768.9441"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="415" y="763.1351">15</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="71" x="433" y="763.1351">Confirmado</text><polygon fill="#181818" points="844,803.6501,854,807.6501,844,811.6501,848,807.6501" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="398" x2="850" y1="807.6501" y2="807.6501"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="405" y="801.8411">16</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240" x="423" y="801.8411">Recarrega os dados do painel (loadData)</text><polygon fill="#181818" points="56,835.3561,46,839.3561,56,843.3561,52,839.3561" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="50" x2="397" y1="839.3561" y2="839.3561"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="62" y="833.5471">17</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306" x="80" y="833.5471">"Recurso desativado. N reservas foram canceladas."</text><!--SRC=[ZLJBZXD13BptLrXzMYHOYGk78918bWGXj4B3TINadVOc3JtjeHzPmTyW3W