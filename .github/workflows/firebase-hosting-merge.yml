# Deploy automático (R6): a cada push/merge na branch main.
# 1.º testa as Security Rules no emulador; 2.º só se os testes passarem, publica no Firebase Hosting.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  testes_regras:
    name: Testar Security Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:regras

  build_and_deploy:
    name: Publicar no Hosting
    needs: testes_regras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAMPUSRESERVAGE }}
          channelId: live
          projectId: campusreservage