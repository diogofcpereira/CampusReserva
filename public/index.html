<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusReserva - Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 100px; background-color: #f4f4f9; }
        .login-box { border: 1px solid #ccc; padding: 30px; border-radius: 8px; width: 300px; background: white; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        input { display: block; width: 90%; margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #004494; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>CampusReserva</h2>
        <input type="email" id="email" placeholder="Email institucional" required>
        <input type="password" id="password" placeholder="Palavra-passe" required>
        <button id="loginBtn">Entrar</button>
        <p id="errorMessage" style="color: red; display: none; font-size: 14px; text-align: center; margin-top: 10px;"></p>
    </div>

    <!-- Script como Módulo (Padrão moderno do Firebase V9+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        
        const firebaseConfig = {
            apiKey: "AIzaSyCHeWE5G8S95G0XzNRlussdIn9jt0q8i7o",
            authDomain: "campusreservage.firebaseapp.com",
            projectId: "campusreservage",
            storageBucket: "campusreservage.firebasestorage.app",
            messagingSenderId: "834601060186",
            appId: "1:834601060186:web:877fe843714f16b8f85563"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Lógica que liga o botão "Entrar" ao Firebase
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('errorMessage');

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("Login com sucesso! Bem-vindo(a) " + userCredential.user.email);
                    errorElement.style.display = 'none';
                })
                .catch((error) => {
                    errorElement.textContent = "Erro: Dados incorretos ou utilizador inexistente.";
                    errorElement.style.display = 'block';
                    console.error("Detalhes do erro:", error.code, error.message);
                });
        });
    </script>
</body>
</html>
